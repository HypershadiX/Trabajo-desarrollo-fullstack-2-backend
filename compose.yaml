services:
  login-service:
    build: ./login-service
    environment:
      DB_URL: jdbc:h2:file:/data/logindb
    volumes:
      - login-data:/data
    restart: unless-stopped

  productos-service:
    build: ./productos-service
    environment:
      DB_URL: jdbc:h2:file:/data/productosdb
    volumes:
      - productos-data:/data
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      LOGIN_SERVICE_URL: http://login-service:8081
      PRODUCTOS_SERVICE_URL: http://productos-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - login-service
      - productos-service
    restart: unless-stopped

volumes:
  login-data:
  productos-data:
