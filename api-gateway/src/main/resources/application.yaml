server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: login-service
              uri: ${LOGIN_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: productos-service
              uri: ${PRODUCTOS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/productos/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
